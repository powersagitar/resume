name: Build LaTeX document (main)

on:
  push:
    tags:
      - "v**"

jobs:
  build_latex:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PDF_NAME: Mohan_Dong_Resume.pdf
      PDF_NAME_WITH_REF: Mohan_Dong_Resume_${{ github.ref_name }}.pdf
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          post_compile: |
            mv 'main.pdf' '${{ env.PDF_NAME_WITH_REF }}'

      - name: Upload PDF file
        uses: actions/upload-artifact@v4
        with:
          name: Resume
          path: ${{ env.PDF_NAME_WITH_REF }}

      - name: Check for broken links
        id: link_check
        run: |
          pipx install pdfx --quiet
          pdfx -c "$PDF_NAME_WITH_REF" > pdfx_output.txt 2>&1 || true
          cat pdfx_output.txt
          if grep -q "broken (reason" pdfx_output.txt; then
            echo "has_broken_links=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_broken_links=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        run: |
          NOTES="Built on $(date)"
          if [ "${{ steps.link_check.outputs.has_broken_links }}" = "true" ]; then
            NOTES="> [!WARNING]
          > The compiled PDF contains broken links. Check the CI logs for details.

          $NOTES"
          fi
          if [ "${{ github.event.base_ref }}" = "refs/heads/main" ]; then
            cp "$PDF_NAME_WITH_REF" "$PDF_NAME"
            gh release create $GITHUB_REF_NAME "$PDF_NAME" --title "Resume $GITHUB_REF_NAME" --notes "$NOTES" --latest
          else
            gh release create $GITHUB_REF_NAME "$PDF_NAME_WITH_REF" --title "Resume $GITHUB_REF_NAME" --notes "$NOTES" --latest=false
          fi
        env:
          GH_TOKEN: ${{ github.token }}
